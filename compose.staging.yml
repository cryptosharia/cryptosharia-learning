services:
  learning:
    image: cryptosharia-learning:staging-sha
    container_name: cryptosharia-learning-staging
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    env_file: .env.staging
    networks: [cryptosharia_proxy]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  cryptosharia_proxy:
    external: true
